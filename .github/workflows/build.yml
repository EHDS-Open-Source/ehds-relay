name: build

# Builds the API and web images and the Helm chart, and publishes them to GHCR.
#
# Versions are the chart's version/appVersion from Chart.yaml plus a pre-release suffix, so a
# chart always installs the images built with it:
#   main             -rc.N          N counts merges since the chart version last changed
#   mvp-integration  -beta.N        the dev line until it merges into main
#   pull request     -pr.<number>.g<sha>   built, not pushed
#   anything else    -branch.g<sha> (manual runs on other branches)
#
# Install a published chart with
#   helm install <release> oci://ghcr.io/<owner>/charts/ehds-relay --version <chart version>

on:
  push:
    branches:
      - main
      - mvp-integration
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  # Run on any branch from the Actions tab, e.g. to deploy a feature branch to a dev cluster
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART_DIR: deploy/helm/ehds-relay
  REGISTRY: ghcr.io

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      owner: ${{ steps.vars.outputs.owner }}
      push: ${{ steps.vars.outputs.push }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version suffix counts merges

      - name: Work out versions
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          chart="$CHART_DIR/Chart.yaml"
          version=$(sed -n 's/^version: *//p' "$chart")
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' "$chart")

          # N restarts at 1 after every chart version bump, and a commit always gets the same N
          base=$(git log -1 --first-parent --format=%H -G'^version:' -- "$chart")
          n=$(( $(git rev-list --count --first-parent "${base}..HEAD") + 1 ))
          # "g" (as in git describe) keeps an all-digit sha a valid semver part
          short="g${SHA::7}"

          push=true
          if [[ "$EVENT" == pull_request ]]; then
            suffix="-pr.${PR_NUMBER}.${short}"
            push=false
          else
            case "$REF_NAME" in
              main) suffix="-rc.${n}" ;;
              mvp-integration) suffix="-beta.${n}" ;;
              *) suffix="-branch.${short}" ;;
            esac
          fi

          {
            echo "chart_version=${version}${suffix}"
            echo "version=${app_version}${suffix}"
            echo "owner=${OWNER,,}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"
          echo "Chart ${version}${suffix}, images ${app_version}${suffix}, push: ${push}"

  image:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ehds-relay-api
            context: backend
            file: backend/Dockerfile
          # Built from the repo root: the web app imports example records from backend/tests
          - name: ehds-relay-web
            context: .
            file: frontend/Dockerfile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.init.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ needs.init.outputs.push == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ needs.init.outputs.owner }}/${{ matrix.name }}:${{ needs.init.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.init.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs:
      - init
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Build chart dependencies
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build "$CHART_DIR"

      # The local defaults, and the web app, Gateway, Issuer and separate Postgres switched on
      - name: Lint and render
        run: |
          full=(
            --set web.enabled=true --set web.url=https://relay.example.org
            --set gateway.enabled=true --set gateway.certificate.issuerKind=Issuer
            --set gateway.certificate.issuerName=ci --set-json 'gateway.certificate.issuerSpec={"selfSigned":{}}'
            --set keycloak.mode=production --set keycloak.testUsers=false
            --set keycloak.hostname=https://auth.relay.example.org
            --set postgres.enabled=false --set database.host=db.example.org --set database.sslMode=require
          )
          helm lint "$CHART_DIR"
          helm lint "$CHART_DIR" "${full[@]}"
          helm template ci "$CHART_DIR" > /dev/null
          helm template ci "$CHART_DIR" "${full[@]}" > /dev/null
          helm template ci "$CHART_DIR" "${full[@]}" --set gateway.enabled=false --set ingress.enabled=true > /dev/null

      - name: Package
        env:
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
          APP_VERSION: ${{ needs.init.outputs.version }}
        run: helm package "$CHART_DIR" -d dist --version "$CHART_VERSION" --app-version "$APP_VERSION"

      - name: Push to GHCR
        if: needs.init.outputs.push == 'true'
        env:
          OWNER: ${{ needs.init.outputs.owner }}
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          helm push "dist/ehds-relay-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

      - name: Summary
        env:
          OWNER: ${{ needs.init.outputs.owner }}
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
          VERSION: ${{ needs.init.outputs.version }}
          PUSHED: ${{ needs.init.outputs.push }}
        run: |
          {
            echo "## Images"
            echo "- \`${REGISTRY}/${OWNER}/ehds-relay-api:${VERSION}\`"
            echo "- \`${REGISTRY}/${OWNER}/ehds-relay-web:${VERSION}\`"
            echo "## Helm chart"
            echo "- \`oci://${REGISTRY}/${OWNER}/charts/ehds-relay --version ${CHART_VERSION}\`"
            [[ "$PUSHED" == true ]] || echo "_Pull request build: nothing was pushed._"
          } >> "$GITHUB_STEP_SUMMARY"
