name: ci-api

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/packages/api-client/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches:
      - main
      - mvp-integration
    paths:
      - "backend/**"
      - "frontend/packages/api-client/**"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  # Only cancel superseded PR runs; keep every run on main and mvp-integration
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Lint, type check, then pytest. The tests start a throwaway Postgres with
      # testcontainers, which uses the Docker daemon on the runner.
      - name: Install, check and test
        run: make -C backend install check test

  # The typed frontend client is generated from the API's OpenAPI spec and committed. Regenerate
  # it here and fail if that changes anything, i.e. if an API change was pushed without it.
  api-client-drift:
    name: api-client-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: make install

      - name: Regenerate the API client
        run: make api_client

      - name: Fail if the generated client changed
        run: |
          drift=0
          git diff --exit-code -- frontend/packages/api-client || drift=1
          untracked=$(git ls-files --others --exclude-standard -- frontend/packages/api-client)
          if [ -n "$untracked" ]; then
            echo "Untracked files:"
            echo "$untracked"
            drift=1
          fi
          if [ "$drift" = 1 ]; then
            echo "::error::The API client is out of date: run \`make api_client\` and commit"
            exit 1
          fi
