name: ci-ui

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-ui.yml"
  push:
    branches:
      - main
      - mvp-integration
    paths:
      - "frontend/**"
      - ".github/workflows/ci-ui.yml"

permissions:
  contents: read

concurrency:
  group: ci-ui-${{ github.ref }}
  # Only cancel superseded PR runs; keep every run on main and mvp-integration
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in frontend/package.json.
      # This must run before setup-node so that `cache: pnpm` can find pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Install (frozen lockfile), then eslint, prettier --check and tsc, then
      # vitest, then the production build.
      - name: Install, check, test and build
        run: make -C frontend install check test build
