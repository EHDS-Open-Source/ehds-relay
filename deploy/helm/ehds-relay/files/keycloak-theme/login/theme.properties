# EHDS Relay sign-in pages. Keycloak's own "keycloak.v2" theme supplies the page templates
# (accessible markup, password show/hide, the live password checks); this theme swaps the page
# frame (template.ftl), the sign-in page (login.ftl), the password rules
# (password-validation.ftl) and the English wording, and styles everything with its own CSS
# instead of PatternFly. Every kc*Class below names a class from resources/css/relay.css, so
# no PatternFly or Font Awesome class reaches the page.
parent=keycloak.v2
import=common/keycloak

# English only: the wording below is written for it.
locales=en

# No PatternFly. tokens.css and fonts.css are generated from the web app (see the README).
stylesCommon=
styles=css/tokens.css css/fonts.css css/relay.css
darkMode=false

