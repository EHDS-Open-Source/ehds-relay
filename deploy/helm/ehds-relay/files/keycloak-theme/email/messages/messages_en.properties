# English wording of the EHDS Relay emails. The HTML bodies use the relay* keys (see html/);
# the plain-text parts use Keycloak's own keys, reworded here. Arguments of the Keycloak keys:
# {0} the link, {1} its lifetime in minutes, {2} the realm name, {3} its lifetime in words
# ("1 hour"); executeActions has the actions as {3} and the lifetime in words as {4}.
# Single quotes are written twice ('') because these are Java message formats.

