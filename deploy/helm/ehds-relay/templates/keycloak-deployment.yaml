{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ehds-relay.fullname" . }}-keycloak
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  # One pod at a time: dev mode is memory hungry
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ehds-relay.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ehds-relay.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      {{- if include "ehds-relay.keycloakDbEnabled" . }}
      initContainers:
        # Creates the Keycloak role and database on the bundled Postgres if they are missing.
        # Postgres only runs its init scripts on a new volume, so this also reaches existing
        # clusters. Safe to repeat.
        - name: keycloak-db-init
          image: "postgres:{{ .Values.postgres.image.tag }}"
          env:
            - name: PGHOST
              value: {{ include "ehds-relay.dbHost" . | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ehds-relay.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: KC_DB_NAME
              value: {{ .Values.keycloak.database.name | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ehds-relay.fullname" . }}-keycloak
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ehds-relay.fullname" . }}-keycloak
                  key: KC_DB_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -v db="$KC_DB_NAME" -v user="$KC_DB_USERNAME" \
                -v pw="$KC_DB_PASSWORD" -d postgres <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'user')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user') \gexec
              SELECT format('ALTER ROLE %I PASSWORD %L', :'user', :'pw') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'user')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
              SQL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - secretRef:
                name: {{ include "ehds-relay.fullname" . }}-keycloak
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Tokens and browser redirects use this address. Back-channel endpoints (token,
            # keys) follow the address the caller used, so pods can reach them in-cluster.
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # Filled into the ${RELAY_*} placeholders of the realm JSON (first import only)
            {{- include "ehds-relay.keycloakRealmEnv" . | nindent 12 }}
            {{- if include "ehds-relay.keycloakDbEnabled" . }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" (include "ehds-relay.dbHost" .) .Values.database.port .Values.keycloak.database.name | quote }}
            {{- end }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # The first dev-mode start builds and imports before it listens: give it time
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm
          configMap:
            name: {{ include "ehds-relay.fullname" . }}-keycloak-realm
{{- end }}
