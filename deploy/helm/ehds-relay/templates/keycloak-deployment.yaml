{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ehds-relay.fullname" . }}-keycloak
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  # One pod at a time: dev mode is memory hungry
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ehds-relay.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ehds-relay.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (include "ehds-relay.keycloakDbEnabled" .) .Values.database.provision }}
      initContainers:
        {{- include "ehds-relay.dbInitContainer" (dict "ctx" . "name" "keycloak-db-init" "database" .Values.keycloak.database.name "secret" (include "ehds-relay.keycloakSecretName" .) "userKey" "KC_DB_USERNAME" "passwordKey" "KC_DB_PASSWORD") | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          {{- if eq .Values.keycloak.mode "production" }}
          args: ["start", "--import-realm"]
          {{- else }}
          args: ["start-dev", "--import-realm"]
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - secretRef:
                name: {{ include "ehds-relay.keycloakSecretName" . }}
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Tokens and browser redirects use this address. Back-channel endpoints (token,
            # keys) follow the address the caller used, so pods can reach them in-cluster.
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            {{- if eq .Values.keycloak.mode "production" }}
            # TLS ends at the ingress, which passes the original scheme and host on
            - name: KC_PROXY_HEADERS
              value: xforwarded
            {{- end }}
            # Filled into the ${RELAY_*} placeholders of the realm JSON (first import only)
            {{- include "ehds-relay.keycloakRealmEnv" . | nindent 12 }}
            {{- if include "ehds-relay.keycloakDbEnabled" . }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s%s" (include "ehds-relay.dbHost" .) .Values.database.port .Values.keycloak.database.name (include "ehds-relay.dbQuery" .) | quote }}
            {{- end }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # The EHDS Relay sign-in and email theme, selected on the realm. Dev mode does not
            # cache themes, so an edit shows once the kubelet has synced the ConfigMap (about a
            # minute).
            - name: theme
              mountPath: /opt/keycloak/themes/ehds-relay
              readOnly: true
          # The first dev-mode start builds and imports before it listens: give it time
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm
          configMap:
            name: {{ include "ehds-relay.fullname" . }}-keycloak-realm
        - name: theme
          configMap:
            name: {{ include "ehds-relay.fullname" . }}-keycloak-theme
            items:
              {{- range $path, $_ := .Files.Glob "files/keycloak-theme/**" }}
              - key: {{ trimPrefix "files/keycloak-theme/" $path | replace "/" "--" }}
                path: {{ trimPrefix "files/keycloak-theme/" $path }}
              {{- end }}
{{- end }}
