{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ehds-relay.fullname" . }}-api
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ehds-relay.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ehds-relay.apiSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $provision := and .Values.database.provision (not .Values.postgres.enabled) }}
      {{- if or .Values.api.migrations.enabled $provision }}
      initContainers:
        {{- if $provision }}
        # The bundled Postgres creates the app database itself; a separate server needs this
        {{- include "ehds-relay.dbInitContainer" (dict "ctx" . "name" "db-init" "database" .Values.database.name "secret" (include "ehds-relay.dbSecretName" .) "userKey" "USERDB_USER" "passwordKey" "USERDB_PASSWORD") | nindent 8 }}
        {{- end }}
        {{- if .Values.api.migrations.enabled }}
        - name: migrations
          image: {{ include "ehds-relay.image" (dict "ctx" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # Retry until the database accepts connections
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 60); do
                alembic upgrade head && exit 0
                echo "migrations failed, retrying in 2s ($i/60)"; sleep 2
              done
              exit 1
          env:
            {{- include "ehds-relay.dbEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "ehds-relay.image" (dict "ctx" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- if .Values.api.reload }}
          # Appended to the image's uvicorn ENTRYPOINT (dev only, used by Tilt)
          args: ["--reload"]
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "ehds-relay.dbEnv" . | nindent 12 }}
            {{- include "ehds-relay.oidcEnv" . | trim | nindent 12 }}
            {{- include "ehds-relay.webEnv" . | trim | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
