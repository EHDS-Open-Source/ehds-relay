{{- if .Values.keycloak.enabled }}
# Realm imported by Keycloak at start-up when the realm does not exist yet, and read by realm-init
# to apply later additions. The ${RELAY_*} placeholders in the JSON are filled from the container's
# environment (see the keycloakRealmEnv helper). The test users
# have dev-only throwaway passwords: keycloak.testUsers=false leaves them out.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ehds-relay.fullname" . }}-keycloak-realm
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  {{ .Values.keycloak.realm }}-realm.json: |-
    {{- if .Values.keycloak.testUsers }}
    {{- .Files.Get "files/ehds-relay-realm.json" | nindent 4 }}
    {{- else }}
    {{- $realm := .Files.Get "files/ehds-relay-realm.json" | fromJson }}
    {{- $_ := unset $realm "users" }}
    {{- $realm | toPrettyJson | nindent 4 }}
    {{- end }}
{{- end }}
