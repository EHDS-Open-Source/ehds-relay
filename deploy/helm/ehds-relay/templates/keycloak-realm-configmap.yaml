{{- if .Values.keycloak.enabled }}
# Realm imported by Keycloak at start-up when the realm does not exist yet, and read by realm-init
# to apply later additions. The ${RELAY_*} placeholders in the JSON are filled from the container's
# environment (see the keycloakRealmEnv helper). The test-user
# passwords in it are dev-only throwaway values; do not use this realm outside local development.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ehds-relay.fullname" . }}-keycloak-realm
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  {{ .Values.keycloak.realm }}-realm.json: |-
    {{- .Files.Get "files/ehds-relay-realm.json" | nindent 4 }}
{{- end }}
