{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ehds-relay.fullname" . }}-keycloak
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.admin.user | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloak.admin.password | quote }}
{{- if include "ehds-relay.keycloakDbEnabled" . }}
  KC_DB_USERNAME: {{ .Values.keycloak.database.user | quote }}
  KC_DB_PASSWORD: {{ .Values.keycloak.database.password | quote }}
{{- end }}
{{- end }}
