{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ehds-relay.dbSecretName" . }}
  labels:
    {{- include "ehds-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  USERDB_USER: {{ .Values.database.user | quote }}
  USERDB_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.superuserPassword | quote }}
{{- end }}
