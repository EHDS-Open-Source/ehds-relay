api:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/ehds-open-source/ehds-relay-api
    # Empty: the chart's appVersion. CI packages each chart with the tag of the images it built.
    tag: ""
    pullPolicy: IfNotPresent
  logLevel: info
  # uvicorn --reload, for the Tilt live-update loop only
  reload: false
  service:
    port: 8000
  resources: {}
  # Run `alembic upgrade head` in an init container before the API starts
  migrations:
    enabled: true

# Background worker: same image as the API, different command.
worker:
  enabled: true
  replicas: 1
  # Defaults to the API image
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  # Restart the worker on code changes (watchfiles), for the Tilt live-update loop only
  reload: false
  resources: {}

# Where the user's browser reaches the web app. The browser talks to the API through this
# origin, so sign-in redirects, the session cookie and invitation links all use it.
web:
  url: http://localhost:5173
  # The built web app served by nginx (frontend/Dockerfile). Off for local development, where
  # the Vite dev server on the host serves it instead.
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/ehds-open-source/ehds-relay-web
    # Empty: the chart's appVersion
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources: {}

# Secrets for pulling the images, e.g. while the GHCR packages are private
imagePullSecrets: []

# Gateway API alternative to the ingress below: a Gateway of the release's own, HTTPRoutes for web.url and
# keycloak.hostname, an http-to-https redirect, and optionally a cert-manager Certificate for
# both hosts. Needs web.enabled.
gateway:
  enabled: false
  className: traefik
  # Must match the Traefik entrypoints the GatewayClass serves (Traefik chart defaults)
  httpPort: 8000
  httpsPort: 8443
  # Secret holding the certificate for both hosts. Empty: <release>-tls.
  tlsSecretName: ""
  # cert-manager issuer for that certificate. Empty name: no Certificate, provide the secret.
  certificate:
    issuerKind: ClusterIssuer
    issuerName: ""
    # Spec of a namespaced cert-manager Issuer to create under issuerName (set issuerKind:
    # Issuer), e.g. ACME with a DNS-01 solver. Empty: use an issuer that already exists.
    issuerSpec: {}

# Routes web.url and keycloak.hostname to the services. The web host sends /api, /healthz and
# /readyz to the API and everything else to the web app, so the browser sees one origin.
# Needs web.enabled. Hosts come from web.url and keycloak.hostname.
ingress:
  enabled: false
  className: traefik
  # e.g. cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}
  # Secret names for the certificates (cert-manager creates them from the annotation above).
  # Empty: no tls section.
  tls:
    webSecretName: ""
    keycloakSecretName: ""

# Browser sessions issued by the API after sign-in
session:
  # Cookies ignore the port, so releases sharing a host name need different names.
  cookieName: relay_session
  # A session ends after this long without a request, and after maxHours regardless.
  idleMinutes: 60
  maxHours: 12

# How the API talks to the OpenID Connect provider (the app is only an OIDC client).
# Defaults point at the bundled Keycloak below.
oidc:
  # Where the API fetches the discovery document, signing keys and tokens from.
  # Empty: the bundled Keycloak's in-cluster URL.
  internalUrl: ""
  # The issuer as browsers and tokens see it. Empty: keycloak.hostname + the realm path.
  issuerUrl: ""
  clientId: ehds-relay-bff
  # Dev-only throwaway default. Override it, or point existingSecret at a secret with the
  # key OIDC_CLIENT_SECRET, for anything but a local cluster.
  clientSecret: ehds-relay-dev-secret
  existingSecret: ""

# Bundled Keycloak in dev mode, for local development and evaluation only. Its data lives in its
# own database on the bundled Postgres (same volume as the app data), so users keep their ids
# across restarts. The realm in files/ehds-relay-realm.json is imported once, when the realm does
# not exist yet; later changes are applied by realm-init (see below). With postgres.enabled=false
# Keycloak falls back to in-pod H2 and loses everything on restart.
keycloak:
  enabled: true
  # dev: `start-dev` (no caching, relaxed checks), for local clusters.
  # production: `start` behind a TLS-terminating ingress (keycloak.hostname must be https).
  mode: dev
  # The test users in the realm file (owner, standard, invitee) with their published dev
  # passwords. Switch off for anything reachable from outside your machine.
  testUsers: true
  # Secret with KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD and, with the
  # database on, KC_DB_USERNAME and KC_DB_PASSWORD. Empty: created from the values below.
  existingSecret: ""
  image:
    repository: keycloak/keycloak
    tag: "26.8.1"
    pullPolicy: IfNotPresent
  realm: ehds-relay
  service:
    port: 8080
  # Where the user's browser reaches Keycloak (e.g. a port-forward). Tokens carry this as
  # their issuer, so it must be what the browser actually uses.
  hostname: http://localhost:8080
  # Browser-facing URLs of the web app and the API, allowed as redirect targets.
  # Empty webUrl: web.url.
  webUrl: ""
  apiUrl: http://localhost:8000
  # Keycloak's own database, on the bundled Postgres or on database.host. The role and database
  # are created if missing (see database.provision).
  database:
    enabled: true
    name: keycloak
    user: keycloak
    # Dev-only throwaway value
    password: keycloak
  # Dev-only throwaway admin login for the Keycloak console
  admin:
    user: admin
    password: admin
  resources:
    requests:
      memory: 512Mi

# Applies later realm changes to the existing realm and runs run-once migrations (see
# files/realm-init). Runs as its own Deployment: stock python image, script from a ConfigMap.
# Signs in with the Keycloak bootstrap admin above (dev only).
realmInit:
  enabled: true
  image:
    repository: python
    tag: 3.13-slim
    pullPolicy: IfNotPresent
  resources: {}

# Mail server for outgoing email. Defaults to the bundled Mailpit when it is enabled.
smtp:
  host: ""
  port: 1025
  from: ehds-relay@example.org

# Mailpit: catches all outgoing email in development (SMTP 1025, web UI and API 8025).
# Off by default; Tilt and scripts/deploy.sh switch it on.
mailpit:
  enabled: false
  image:
    repository: axllent/mailpit
    tag: v1.33.0
    pullPolicy: IfNotPresent
  # SMTP is served on smtp.port
  service:
    uiPort: 8025
  # Serve the web UI and API under this path (e.g. /mailpit/) instead of /
  webroot: ""
  # Secret with the key MP_UI_AUTH ("user:password", several separated by spaces) to require
  # basic auth for the web UI and API. Empty: no auth.
  uiAuthSecret: ""
  # With gateway.enabled and a webroot: route <web host><webroot> to Mailpit. Only for test
  # environments whose gateway is not open to the public.
  route: false
  resources: {}

# Connection settings for the application database. host defaults to the bundled
# postgres subchart (<release>-postgres); set it when postgres.enabled=false.
database:
  host: ""
  port: 5432
  name: relay
  # libpq sslmode for every connection, e.g. require for a managed server.
  # Empty: the client default.
  sslMode: ""
  # Create the app and Keycloak roles and databases if they are missing, signed in as
  # superuser with POSTGRES_PASSWORD. On a managed server use its admin login.
  provision: true
  superuser: postgres
  # Secret holding USERDB_USER / USERDB_PASSWORD / POSTGRES_PASSWORD. Created by this
  # chart from the values below unless existingSecret is set.
  existingSecret: ""
  user: relay
  password: relay
  superuserPassword: postgres

# groundhog2k/postgres subchart (official postgres image). Off when using managed Postgres.
postgres:
  enabled: true
  image:
    tag: "17"
  settings:
    existingSecret: ehds-relay-db
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
  userDatabase:
    existingSecret: ehds-relay-db
    name:
      secretKey: POSTGRES_DB
    user:
      secretKey: USERDB_USER
    password:
      secretKey: USERDB_PASSWORD
  storage:
    requestedSize: 1Gi
